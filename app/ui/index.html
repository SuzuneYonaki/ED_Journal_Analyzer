<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elite Dangerous Journal Analyzer</title>
  <link rel="icon" type="image/png" href="/static/icon.png">
  <link rel="stylesheet" href="/static/css/style.css">
  <script>
    (function() {
      var savedTheme = localStorage.getItem('ed_theme');
      if (savedTheme) {
        document.documentElement.setAttribute('data-theme', savedTheme);
      }
      var saved = localStorage.getItem('app_base_font_size');
      var size = saved ? parseInt(saved, 10) : 18;
      if (!isNaN(size) && size >= 8 && size <= 60) {
        document.documentElement.style.fontSize = size + 'px';
      } else {
        document.documentElement.style.fontSize = '18px';
      }
      var savedLang = localStorage.getItem('ed_lang');
      if (savedLang === 'en' || savedLang === 'ja') {
        document.documentElement.lang = savedLang;
      }
    })();
  </script>
</head>
<body>
  {% include "components/banner.html" %}

  {% include "components/header.html" %}

  <!-- Main Container (3-pane) -->
  <div class="main-container">
    {% include "components/left_pane.html" %}

    {% include "components/center_pane.html" %}

    {% include "components/right_pane.html" %}
  </div>

  {% include "components/modals.html" %}

  <script src="/static/js/i18n.js"></script>
  <script src="/static/js/utils.js"></script>
  <script src="/static/js/inspector.js"></script>
  <script src="/static/js/mining_view.js"></script>
  <script src="/static/js/system_map.js"></script>
  <script src="/static/js/app.js"></script>
</body>
</html>
